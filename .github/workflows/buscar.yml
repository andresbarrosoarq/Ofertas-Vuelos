name: Buscar ofertas

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón "Actualizar ahora" de la app
  push:
    branches: [main]
    paths: [config.json, site/**, scripts/**, .github/workflows/buscar.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar vuelos
        run: python scripts/buscar.py
      - name: Guardar resultados
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "ofertas-bot"
          git config user.email "ofertas-bot@users.noreply.github.com"
          git add site/vuelos.json
          git diff --cached --quiet || git commit -m "Actualizar ofertas [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  publicar:
    needs: buscar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
